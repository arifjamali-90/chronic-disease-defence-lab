<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Slip Checker · Chronic Disease Defence Lab</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fff;--surface:#F1F5F8;--line:#C9D6DF;--ink:#0E1A24;--muted:#3D4F5C;--accent:#1D5C8C;--ok:#17703A;--ok-bg:#E3F3E8;--bad:#B23A12;--bad-bg:#FBE9E2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Tahoma,Verdana,"DejaVu Sans",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:14px}
h1{font-family:"Century Gothic",Avenir,sans-serif;font-size:28px;margin:0}
p{margin:0}.small{font-size:14px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-weight:bold;font-size:15px}
input{font:inherit;font-weight:normal;padding:10px;border-radius:10px;border:2px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:bold;cursor:pointer;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:#fff;padding:10px 16px;align-self:flex-start}
.res{padding:12px 14px;border-radius:10px;font-weight:bold}
.res.ok{background:var(--ok-bg);color:var(--ok);border-left:5px solid var(--ok)}
.res.no{background:var(--bad-bg);color:var(--bad);border-left:5px solid var(--bad)}
</style></head><body><div class="wrap">
<h1>Attendance slip checker</h1>
<p class="small">For the lecturer. Copy the details from a student's slip exactly as shown. The check code is recalculated from them; a match means the slip was produced by the lab page and has not been edited.</p>
<label>Name<input id="n"></label>
<label>Matric number<input id="m"></label>
<label>Completed (as shown, e.g. 2026-11-24 21:05)<input id="d" placeholder="YYYY-MM-DD HH:MM"></label>
<div class="row2"><label>Activity 1 score<input id="a1" inputmode="numeric"></label><label>Activity 2 score<input id="a2" inputmode="numeric"></label></div>
<label>Activity 3: products ready to launch<input id="a3" inputmode="numeric"></label>
<label>Check code on the slip<input id="c" placeholder="XXXX-XXXX"></label>
<button id="go">Check slip</button>
<p id="out" class="res" hidden></p>
</div>
<script>
const SLIP_SALT='CDDL-A261-NCD';
const normName=x=>x.trim().replace(/\s+/g,' ').toUpperCase();
const normMat=x=>x.trim().replace(/\s+/g,'').toUpperCase();
const num=x=>String(parseInt(String(x).replace(/[^\d-]/g,''),10));
async function code(n,m,d,a1,a2,a3){const t=[SLIP_SALT,normName(n),normMat(m),d.trim(),num(a1),num(a2),num(a3)].join('|');
const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));const x=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();return x.slice(0,4)+'-'+x.slice(4,8)}
document.getElementById('go').onclick=async()=>{const g=id=>document.getElementById(id).value;
const want=await code(g('n'),g('m'),g('d'),g('a1'),g('a2'),g('a3'));const got=g('c').trim().toUpperCase().replace(/\s/g,'');
const o=document.getElementById('out');o.hidden=false;
if(got===want){o.className='res ok';o.textContent='Valid slip. The details match the check code.'}
else{o.className='res no';o.textContent='Does not match. Check each field was typed exactly as on the slip; if it still fails, the slip may have been edited.'}};
</script></body></html>
